[build]
builder = "nixpacks"

[[services]]
name = "backend"
source = "backend"

[services.build]
buildCommand = "pip install -r requirements.txt"

[services.deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
healthcheckPath = "/health"
restartPolicyType = "on_failure"

[[services]]
name = "celery-worker"
source = "backend"

[services.deploy]
startCommand = "celery -A app.workers.celery_app worker --loglevel=info"
restartPolicyType = "on_failure"

[[services]]
name = "celery-beat"
source = "backend"

[services.deploy]
startCommand = "celery -A app.workers.celery_app beat --loglevel=info"
restartPolicyType = "on_failure"

[[services]]
name = "frontend"
source = "frontend"

[services.build]
buildCommand = "npm install && npm run build"

[services.deploy]
startCommand = "npx serve dist --listen 3000"
restartPolicyType = "on_failure"