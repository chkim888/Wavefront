name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wavefront_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run smoke test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/wavefront_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test_secret_key
          JWT_ALGORITHM: HS256
          JWT_EXPIRY_MINUTES: 60
          YOUTUBE_API_KEY: test_key
          POSTGRES_DB: wavefront_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        run: PYTHONPATH=. pytest tests/test_smoke.py -v